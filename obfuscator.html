<!DOCTYPE html>

            margin: 0 auto;
            padding: 20px;

        h2 { text-align: center; color: #89b4fa; }

</head>
<body>

    <script>

                chunks.push(hex.substring(i, i + chunkSize));

            const vKey = genVar(); const vArr = genVar(); const vFunc = genVar();

            const vHex = genVar(); const vExec = genVar();

        function copyOutput() {

            if (!outputEl.value) {
                alert('Belum ada hasil yang bisa disalin.');
                return;
            }
            outputEl.select();
            outputEl.setSelectionRange(0, 99999); // Untuk perangkat mobile
